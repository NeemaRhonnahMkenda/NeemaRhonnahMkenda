# Draws a snake eating your contribution graph (light + dark versions) and
# publishes the SVGs to the "output" branch, which the README embeds.
# Runs daily, on every push to main, and on demand (Actions tab → Run workflow).
name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # daily, 06:00 Nairobi time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
